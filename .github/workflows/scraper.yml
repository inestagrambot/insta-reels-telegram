name: Instagram Reels → Telegram

on:
  schedule:
    # every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pages.json"

permissions:
  contents: write

concurrency:
  group: insta-reels-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          MAX_NEW_PER_PAGE: "4"
          TELEGRAM_MAX_MB: "49"
        run: python main.py

      - name: Commit updated history.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --cached --quiet; then
            echo "history.json unchanged — nothing to commit"
          else
            git commit -m "chore: update history.json [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            git push
          fi
